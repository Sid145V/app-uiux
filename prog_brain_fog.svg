<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="fogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="50%" stop-color="#DCFCE7"/>
      <stop offset="100%" stop-color="#FAF5FF"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#fogBg)"/>
  
  <!-- Glowing Synapse Rays -->
  <g transform="translate(420, 130)">
    <circle cx="0" cy="0" r="75" fill="#10B981" opacity="0.12"/>
    <circle cx="0" cy="0" r="50" fill="#34D399" opacity="0.2"/>
    
    <!-- Synapse Nodes -->
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#059669" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#059669" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
    <line x1="-50" y1="-50" x2="50" y2="50" stroke="#059669" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
    
    <circle cx="-50" cy="-50" r="6" fill="#10B981"/>
    <circle cx="50" cy="50" r="6" fill="#10B981"/>
    <circle cx="-70" cy="0" r="5" fill="#059669"/>
    <circle cx="70" cy="0" r="5" fill="#059669"/>
    <circle cx="0" cy="-70" r="6" fill="#10B981"/>
    <circle cx="0" cy="70" r="6" fill="#059669"/>
  </g>

  <!-- Organic Wave -->
  <path d="M 0,210 Q 180,160 360,220 T 600,190 L 600,300 L 0,300 Z" fill="#059669" opacity="0.15"/>
  <path d="M 0,240 Q 140,200 320,250 T 600,220 L 600,300 L 0,300 Z" fill="#10B981" opacity="0.1"/>

  <!-- Text Label Badge Artwork -->
  <g transform="translate(40, 50)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#FFFFFF" opacity="0.95"/>
    <text x="90" y="21" font-family="sans-serif" font-size="13" font-weight="800" fill="#047857" text-anchor="middle" letter-spacing="1">BRAIN & FOCUS RESET</text>
  </g>
</svg>
