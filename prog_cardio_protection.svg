<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="cardioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="50%" stop-color="#FEE2E2"/>
      <stop offset="100%" stop-color="#FFF0F6"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#cardioBg)"/>
  
  <!-- Heart Vitality Pulse Artwork -->
  <g transform="translate(430, 130)">
    <circle cx="0" cy="0" r="65" fill="#EF4444" opacity="0.15"/>
    <circle cx="0" cy="0" r="45" fill="#F87171" opacity="0.25"/>
    
    <!-- Heart Shape -->
    <path d="M 0,-15 C -25,-40 -50,-10 0,35 C 50,-10 25,-40 0,-15 Z" fill="url(#heartGrad)"/>
  </g>

  <!-- ECG Heartbeat Pulse Line -->
  <path d="M 0,170 L 180,170 L 200,140 L 215,200 L 235,120 L 255,180 L 270,170 L 600,170" fill="none" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M 0,220 Q 200,180 400,240 T 600,200 L 600,300 L 0,300 Z" fill="#EF4444" opacity="0.1"/>

  <!-- Text Label Badge Artwork -->
  <g transform="translate(40, 50)">
    <rect x="0" y="0" width="190" height="32" rx="16" fill="#FFFFFF" opacity="0.95"/>
    <text x="95" y="21" font-family="sans-serif" font-size="13" font-weight="800" fill="#B91C1C" text-anchor="middle" letter-spacing="1">CARDIOVASCULAR CARE</text>
  </g>
</svg>
