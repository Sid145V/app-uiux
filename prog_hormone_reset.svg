<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F6"/>
      <stop offset="50%" stop-color="#FCE7F3"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
    <linearGradient id="bloom1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7B6D2"/>
      <stop offset="40%" stop-color="#EC5DAA"/>
      <stop offset="100%" stop-color="#7A3FD1"/>
    </linearGradient>
    <linearGradient id="sun1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bg1)"/>
  
  <!-- Glowing Sun & Sunbeams -->
  <circle cx="480" cy="80" r="60" fill="url(#sun1)" opacity="0.45"/>
  <circle cx="480" cy="80" r="90" fill="#FDE047" opacity="0.15"/>
  
  <!-- Abstract Botanical Lotus Petals -->
  <g transform="translate(180, 150)">
    <path d="M 0,-80 C 40,-30 60,30 0,90 C -60,30 -40,-30 0,-80 Z" fill="url(#bloom1)" opacity="0.85"/>
    <path d="M -60,-40 C -10,-10 20,40 -40,70 C -80,30 -70,-10 -60,-40 Z" fill="#EC5DAA" opacity="0.6"/>
    <path d="M 60,-40 C 10,-10 -20,40 40,70 C 80,30 70,-10 60,-40 Z" fill="#7A3FD1" opacity="0.6"/>
    <circle cx="0" cy="15" r="18" fill="#FDE047"/>
  </g>
  
  <!-- Wave Lines -->
  <path d="M 0,220 Q 150,180 300,220 T 600,200 L 600,300 L 0,300 Z" fill="#EC5DAA" opacity="0.12"/>
  <path d="M 0,240 Q 200,200 400,250 T 600,230 L 600,300 L 0,300 Z" fill="#7A3FD1" opacity="0.15"/>
  
  <!-- Text Label Badge Artwork -->
  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="170" height="32" rx="16" fill="#FFFFFF" opacity="0.9"/>
    <text x="85" y="21" font-family="sans-serif" font-size="13" font-weight="800" fill="#EC5DAA" text-anchor="middle" letter-spacing="1">HORMONE RESET</text>
  </g>
</svg>
