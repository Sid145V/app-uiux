<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="coreBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="50%" stop-color="#FCE7F3"/>
      <stop offset="100%" stop-color="#FFE4E6"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#coreBg)"/>
  
  <!-- Posture & Core Stability Rings -->
  <g transform="translate(420, 140)">
    <ellipse cx="0" cy="0" rx="90" ry="40" fill="none" stroke="#F43F5E" stroke-width="3" stroke-dasharray="6,6" opacity="0.6" transform="rotate(-15)"/>
    <ellipse cx="0" cy="0" rx="70" ry="30" fill="none" stroke="#E11D48" stroke-width="3" opacity="0.7" transform="rotate(15)"/>
    <circle cx="0" cy="0" r="24" fill="url(#roseGrad)"/>
    <circle cx="0" cy="0" r="45" fill="#FB7185" opacity="0.2"/>
  </g>
  
  <!-- Fluid Flowing Waves -->
  <path d="M 0,200 Q 150,170 300,210 T 600,180 L 600,300 L 0,300 Z" fill="#F43F5E" opacity="0.12"/>
  <path d="M 0,230 Q 180,200 360,240 T 600,210 L 600,300 L 0,300 Z" fill="#E11D48" opacity="0.1"/>

  <!-- Text Label Badge Artwork -->
  <g transform="translate(40, 50)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#FFFFFF" opacity="0.95"/>
    <text x="90" y="21" font-family="sans-serif" font-size="13" font-weight="800" fill="#BE123C" text-anchor="middle" letter-spacing="1">PELVIC FLOOR &amp; CORE</text>
  </g>
</svg>
